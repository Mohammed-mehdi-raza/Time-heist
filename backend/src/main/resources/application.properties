spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/time_heist
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=time_heist

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=time_heist
spring.flyway.default-schema=time_heist
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=false

logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

debug=true