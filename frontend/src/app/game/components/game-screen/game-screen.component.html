<div class="game-screen">

  <div class="maze-area">

    <!--
      GUARD 1
    -->

    @for (guard of guards; track guard.id) {

      <app-guard
        [guardType]="guard.type"
        [animation]="guard.animation"

        [x]="guard.x"
        [y]="guard.y"

        [width]="100"
        [height]="100"

        [frameSpeed]="90"

        [loop]="true">
      </app-guard>

    }

  </div>

</div>
