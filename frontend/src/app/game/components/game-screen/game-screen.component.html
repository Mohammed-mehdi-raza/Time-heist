<div class="gameScreenContainer">
    @if (gameMap) {
        <div class="gameHud">
            <button class="menuButton" type="button" (click)="goToMainMenu()">MAIN MENU</button>
            <div class="timerBadge">TIME: {{ formatTime(currentTime) }}</div>
        </div>
        <app-map [gameMap]="gameMap"></app-map>

        @if (gameMessage && !isGameLost) {
            <div class="gameMessageBar">{{ gameMessage }}</div>
        }
    }

    @if (isGameWon) {
        <app-heist-modal [stats]="heistStats"></app-heist-modal>
    }

    @if (isGameLost) {
        <app-game-over-modal [reason]="gameMessage" (restart)="restartGame()" (mainMenu)="goToMainMenu()"></app-game-over-modal>
    }
</div>
