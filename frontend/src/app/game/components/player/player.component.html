@if (player && position) {
  <div
    class="player"
    [style.left.%]="((position.x + 0.5) / gameMap.width) * 100"
    [style.top.%]="((position.y + 0.5) / gameMap.height) * 100"
    [style.width.%]="(playerScale / gameMap.width) * 100"
    [style.height.%]="(playerScale / gameMap.height) * 100"
  >
    <img
      src="assets/sprites/Character sprite PNG/PNG Sequences/Walking/0_Fallen_Angels_Walking_000.png"
      alt="Player"
    />
  </div>
}
