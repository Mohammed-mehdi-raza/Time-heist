<div class="auth-parent">
  <div class="auth-content">
    <div class="Heading">
      <img class="diamond-icon" src="/assets/images/diamond.png" alt="Diamond" />
      <div class="title">Time <span class="heist">Heist</span></div>
      <div class="text">Steal the Diamond and Escape.</div>
    </div>

    <div class="form-shell">
      @if (flag === 'login') {
        <app-login
          (registerRequested)="flag = 'register'"
          (loggedIn)="switchToHome()"
        ></app-login>
      } @else if (flag === 'register') {
        <app-register (loginRequested)="flag = 'login'"></app-register>
      } @else {
        <app-home (logoutRequested)="logoutFromHome()"></app-home>
      }
    </div>
  </div>
</div>
